<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCAC 管理後台</title>
    <link rel="preconnect" href="https://fonts.fontsource.org">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/noto-sans-tc@latest/chinese-traditional-400-normal.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/noto-sans-tc@latest/chinese-traditional-700-normal.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone-frame">
    <!-- Splash -->
    <div class="splash" id="splash">
        <div class="splash-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M5 9h14M7 5h10"/></svg>
        </div>
        <h1>CCAC Admin</h1>
        <p>格拉納達山基督教會</p>
        <div class="splash-loader"></div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span class="time" id="statusTime">9:41</span>
        <div class="status-icons">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </div>
    </div>

    <!-- App Header -->
    <div class="app-header">
        <div class="header-top">
            <div class="header-logo">
                <div class="logo-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M5 9h14M7 5h10"/></svg>
                </div>
                <div class="header-title">
                    <h1>管理後台</h1>
                    <p>CCAC Granada Hills</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="logout()" title="登出">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="content" id="content">
        <!-- LOGIN SCREEN -->
        <div class="screen active" id="screen-login">
            <div class="verse-card login-card">
                <div class="verse-text">管理員登入</div>
                <div class="verse-ref">請輸入管理員密碼</div>
            </div>
            <div style="padding:0 20px;">
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="密碼" onkeydown="if(event.key==='Enter') login()" style="width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;font-size:15px;font-family:inherit;background:var(--card);">
                </div>
                <button class="upload-btn" onclick="login()" style="margin-top:0;">登入</button>
                <p style="font-size:11px;color:var(--text-light);text-align:center;margin-top:12px;">示範密碼: admin123</p>
            </div>
        </div>

        <!-- DASHBOARD SCREEN -->
        <div class="screen" id="screen-dashboard">
            <!-- Stats Row -->
            <div class="quick-actions stats-grid">
                <div class="qa-item stat-item" onclick="switchTab('sermons')">
                    <div class="qa-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
                    <span class="stat-number" id="statSermons">0</span>
                    <span style="font-size:10px;color:var(--text-light);font-weight:600;">講道</span>
                </div>
                <div class="qa-item stat-item" onclick="switchTab('documents')">
                    <div class="qa-icon gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                    <span class="stat-number" id="statDocuments">0</span>
                    <span style="font-size:10px;color:var(--text-light);font-weight:600;">文檔</span>
                </div>
                <div class="qa-item stat-item" onclick="switchTab('events')">
                    <div class="qa-icon teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
                    <span class="stat-number" id="statEvents">0</span>
                    <span style="font-size:10px;color:var(--text-light);font-weight:600;">活動</span>
                </div>
                <div class="qa-item stat-item" onclick="switchTab('announcements')">
                    <div class="qa-icon rose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></div>
                    <span class="stat-number" id="statAnnouncements">0</span>
                    <span style="font-size:10px;color:var(--text-light);font-weight:600;">公告</span>
                </div>
            </div>

            <!-- Quick Add Button -->
            <div style="padding:0 20px 16px;">
                <button class="upload-btn" onclick="showAddModal('sermon')" style="background:linear-gradient(135deg, var(--primary), var(--primary-dark));">
                    <span style="font-size:18px;margin-right:8px;">+</span> 新增內容
                </button>
            </div>

            <!-- Tabs -->
            <div class="sermons-tabs" style="padding:0 20px 16px;">
                <button class="tab-btn active" data-tab="sermons" onclick="switchTab('sermons')">🎬 講道</button>
                <button class="tab-btn" data-tab="documents" onclick="switchTab('documents')">📄 文檔</button>
                <button class="tab-btn" data-tab="events" onclick="switchTab('events')">📅 活動</button>
                <button class="tab-btn" data-tab="announcements" onclick="switchTab('announcements')">📢 公告</button>
            </div>

            <!-- Sermons Tab -->
            <div id="tab-sermons" class="tab-content active" style="padding:0 20px;">
                <div id="sermonsList"></div>
            </div>

            <!-- Documents Tab -->
            <div id="tab-documents" class="tab-content" style="padding:0 20px;">
                <div id="documentsList"></div>
            </div>

            <!-- Events Tab -->
            <div id="tab-events" class="tab-content" style="padding:0 20px;">
                <div id="eventsList"></div>
            </div>

            <!-- Announcements Tab -->
            <div id="tab-announcements" class="tab-content" style="padding:0 20px;">
                <div id="announcementsList"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('sermons')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>講道</span>
        </button>
        <button class="nav-item" onclick="switchTab('documents')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>文檔</span>
        </button>
        <button class="nav-item" onclick="switchTab('events')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>活動</span>
        </button>
        <button class="nav-item" onclick="switchTab('announcements')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg>
            <span>公告</span>
        </button>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" id="modalContent" onclick="event.stopPropagation()">
            <div class="modal-handle"></div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
