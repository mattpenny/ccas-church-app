<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCAC 管理後台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛪</text></svg>">
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>

<div class="app-container">

    <!-- ============ 頂部導航 ============ -->
    <header class="app-header">
        <div class="header-top">
            <div class="header-left">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M12 2v20M5 9h14M7 5h10"/>
                    </svg>
                    <span>CCAC Admin</span>
                </div>
            </div>
            <div class="header-right">
                <button class="logout-btn" onclick="logout()" title="登出">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>登出</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ============ 內容區域 ============ -->
    <main class="main-content" id="mainContent">

        <!-- ===== 登入頁面 ===== -->
        <div class="page active" id="page-login">
            <div class="login-card">
                <h2>管理員登入</h2>
                <p class="login-sub">請輸入管理員密碼</p>
                <div class="password-group">
                    <input type="password" id="loginPassword" placeholder="密碼" onkeydown="if(event.key==='Enter') login()">
                    <button class="password-toggle" onclick="togglePassword()" type="button" title="顯示/隱藏密碼">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <button class="btn-primary" onclick="login()">登入</button>
                <p class="login-hint">密碼: Dawn2026</p>
            </div>
        </div>

        <!-- ===== 儀表板 ===== -->
        <div class="page" id="page-dashboard">

            <!-- 統計卡片 -->
            <div class="stats-grid">
                <div class="stat-card" onclick="switchTab('sermons')">
                    <div class="stat-icon purple">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="statSermons">0</span>
                        <span class="stat-label">講道</span>
                    </div>
                </div>
                <div class="stat-card" onclick="switchTab('documents')">
                    <div class="stat-icon gold">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="statDocuments">0</span>
                        <span class="stat-label">文檔</span>
                    </div>
                </div>
                <div class="stat-card" onclick="switchTab('events')">
                    <div class="stat-icon teal">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="statEvents">0</span>
                        <span class="stat-label">活動</span>
                    </div>
                </div>
                <div class="stat-card" onclick="switchTab('announcements')">
                    <div class="stat-icon rose">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="statAnnouncements">0</span>
                        <span class="stat-label">公告</span>
                    </div>
                </div>
            </div>

            <!-- 新增按鈕 -->
            <div class="add-grid">
                <button class="btn-add purple" onclick="showAddModal('sermon')">🎬 新增講道</button>
                <button class="btn-add indigo" onclick="showAddModal('series')">📚 新增系列</button>
                <button class="btn-add gold" onclick="showAddModal('document')">📄 上傳文檔</button>
                <button class="btn-add teal" onclick="showAddModal('event')">📅 新增活動</button>
                <button class="btn-add rose" onclick="showAddModal('announcement')">📢 新增公告</button>
            </div>

            <!-- 標籤頁 -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="sermons" onclick="switchTab('sermons')">🎬 講道</button>
                <button class="tab-btn" data-tab="series" onclick="switchTab('series')">📚 系列</button>
                <button class="tab-btn" data-tab="documents" onclick="switchTab('documents')">📄 文檔</button>
                <button class="tab-btn" data-tab="events" onclick="switchTab('events')">📅 活動</button>
                <button class="tab-btn" data-tab="announcements" onclick="switchTab('announcements')">📢 公告</button>
            </div>

            <!-- 內容列表 -->
            <div id="tab-sermons" class="tab-content active">
                <div id="sermonsList"></div>
            </div>
            <div id="tab-series" class="tab-content">
                <div id="seriesList"></div>
            </div>
            <div id="tab-documents" class="tab-content">
                <div id="documentsList"></div>
            </div>
            <div id="tab-events" class="tab-content">
                <div id="eventsList"></div>
            </div>
            <div id="tab-announcements" class="tab-content">
                <div id="announcementsList"></div>
            </div>

        </div>

    </main>

    <!-- ============ 底部導航 ============ -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" onclick="switchTab('sermons')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <span>講道</span>
        </button>
        <button class="nav-item" onclick="switchTab('series')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span>系列</span>
        </button>
        <button class="nav-item" onclick="switchTab('documents')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span>文檔</span>
        </button>
        <button class="nav-item" onclick="switchTab('events')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>活動</span>
        </button>
        <button class="nav-item" onclick="switchTab('announcements')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            </svg>
            <span>公告</span>
        </button>
    </nav>

    <!-- ============ 模態框 ============ -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- ============ Toast ============ -->
    <div class="toast" id="toast"></div>

</div>

<script src="admin-app.js"></script>
</body>
</html>
