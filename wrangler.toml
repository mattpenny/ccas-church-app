name = "ccac-api"
main = "backend/src/index.js"
compatibility_date = "2024-12-18"

[[d1_databases]]
binding = "DB"
database_name = "ccac-db"
database_id = "your-d1-database-id-here"

[[r2_buckets]]
binding = "R2"
bucket_name = "ccac-storage"              # For PDFs and images only

[vars]
ADMIN_PASSWORD = "admin123"

[env.production]
vars = { ADMIN_PASSWORD = "your-production-password" }

# Static assets
[[routes]]
pattern = "/*"
script = "ccac-api"

[assets]
directory = "./"
binding = "ASSETS"