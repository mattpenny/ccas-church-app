name = "ccac-api"
main = "backend/src/index.js"
compatibility_date = "2024-12-18"

# 管理員密碼不可寫在此檔案（會提交到公開的 Git 儲存庫）。
# 正式環境請用 Cloudflare Secret 設定：
#   wrangler secret put ADMIN_PASSWORD
# 本機開發請建立 .dev.vars（已列入 .gitignore）：
#   ADMIN_PASSWORD="你的本機測試密碼"

[[d1_databases]]
binding = "DB"
database_name = "ccac-db"
database_id = "4196686c-58b4-43fe-8328-c3f10daae70d"
migrations_dir = "backend/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "ccac-storage"

[assets]
directory = "./public"
binding = "ASSETS"